    function days(startY, startM, startD, endY, endM, endD) {
    let start = new Date(startY, startM - 1, startD);  
    let end = new Date(endY, endM - 1, endD);
    return Math.round((end - start) / (24 * 60 * 60 * 1000));
    }

    let year  = today.getFullYear();
    let month = today.getMonth() + 1;
    let date  = today.getDate();
